version: "2"
run:
  timeout: 10m
  go: "1.26"
output:
  sort-order:
    - file
    - linter
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - durationcheck
    - errcheck
    - errorlint
    - exhaustive
    - gocheckcompilerdirectives
    - goconst
    - gocritic
    - gomodguard
    - gosec
    - govet
    - ineffassign
    - modernize
    - nilnil
    - nolintlint
    - paralleltest
    - perfsprint
    - prealloc
    - promlinter
    - protogetter
    - reassign
    - revive
    - staticcheck
    - testifylint
    - tparallel
    - unconvert
    - unused
    - usestdlibvars
    - wastedassign
  settings:
    errcheck:
      check-type-assertions: true
    exhaustive:
      default-signifies-exhaustive: true
    goconst:
      min-len: 2
      min-occurrences: 2
    gocritic:
      disabled-checks:
        - commentFormatting
    gomodguard:
      blocked:
        modules:
          - github.com/magiconair/properties/assert:
              recommendations:
                - github.com/stretchr/testify/assert
          - github.com/golang/mock:
              recommendations:
                - go.uber.org/mock
        local-replace-directives: true
    govet:
      enable-all: true
    nolintlint:
      require-specific: true
    revive:
      enable-all-rules: true
      rules:
        - name: exported
          disabled: true
        - name: add-constant
          disabled: true
        - name: argument-limit
          arguments: [ 6 ]
        - name: file-header
          disabled: true
        - name: flag-parameter
          disabled: true
        - name: import-alias-naming
          disabled: true
        - name: max-public-structs
          disabled: true
        - name: line-length-limit
          disabled: true
        - name: package-comments
          disabled: true
        - name: unexported-return
          disabled: true
        - name: confusing-naming
          disabled: true
        - name: var-naming
          arguments:
            - []
            - []
            - - skip-package-name-checks: true
    staticcheck:
      checks: ["all", "-ST1000", "-ST1003"]
    testifylint:
      enable-all: true
  exclusions:
    generated: lax
    rules:
      - path: (.+)\.go$
        text: don't use an underscore in package name
      - path: (.+)\.go$
        text: don't use package name .* that contains an underscore
      - path: (.+)\.go$
        text: Error return value of .((os\.)?std(out|err)\..*|.*Close|.*Flush|os\.Remove(All)?|.*print(f|ln)?|os\.(Un)?Setenv). is not checked
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
