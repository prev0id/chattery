services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: chattery:${APP_VERSION:-production}
    restart: "no"
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: ${POSTGRES_URL:?}
    entrypoint: ["/app/goose"]
    command: ["-dir", "/app/migrations", "up"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: chattery:${APP_VERSION:-production}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      POSTGRES_URL: ${POSTGRES_URL:?}
      REDIS_ADDRESS: ${REDIS_ADDRESS:?}
      REDIS_USERNAME: ${REDIS_USERNAME:?}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      S3_ENDPOINT: ${S3_ENDPOINT:-minio:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
      S3_BUCKET: ${S3_BUCKET}
      S3_USE_SSL: ${S3_USE_SSL}
      SESSION_KEY: ${SESSION_KEY:?}
      SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN}
      SESSION_EXPIRATION: ${SESSION_EXPIRATION}
      SESSION_REFRESH_BEFORE: ${SESSION_REFRESH_BEFORE}
      MESSAGES_LIMIT: ${MESSAGES_LIMIT}
      IMAGE_MAX_FILE_SIZE: ${IMAGE_MAX_FILE_SIZE}
      IMAGE_MAX_WIDTH: ${IMAGE_MAX_WIDTH}
      IMAGE_MAX_HEIGHT: ${IMAGE_MAX_HEIGHT}
      IMAGE_JPEG_QUALITY: ${IMAGE_JPEG_QUALITY}
      CACHE_USER_SYNC_TIMEOUT: ${CACHE_USER_SYNC_TIMEOUT}
      CACHE_SERVER_SYNC_TIMEOUT: ${CACHE_SERVER_SYNC_TIMEOUT}
      CACHE_DM_SYNC_TIMEOUT: ${CACHE_DM_SYNC_TIMEOUT}
      VOICE_NODE_ID: ${VOICE_NODE_ID}
      VOICE_OWNER_TTL: ${VOICE_OWNER_TTL}
      VOICE_STUN_SERVER: ${VOICE_STUN_SERVER}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${HTTP_PORT:-8080}/ping >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
