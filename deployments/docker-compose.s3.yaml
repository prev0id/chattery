name: chattery-s3
services:
  s3:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${S3_ROOT_PASSWORD}

      MINIO_BROWSER_REDIRECT_URL: https://s3.chattery.space
      MINIO_BROWSER_LOGIN_ANIMATION: "off"
    volumes:
      - s3_data:/data
    expose:
      - "9000" # S3 API
      - "9001" # Web UI
    networks:
      s3_private:
        aliases:
          - chattery-s3

volumes:
  s3_data:

networks:
  s3_private:
    name: chattery-s3-private
    external: true
