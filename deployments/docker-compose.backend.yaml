name: chattery-backend

x-backend-env: &backend-env
  APP_DEBUG: "false"
  APP_NAME: chattery
  APP_VERSION: production
  HTTP_HOST: 0.0.0.0
  HTTP_PORT: "8080"
  POSTGRES_URL: ${POSTGRES_URL:?POSTGRES_URL is required}
  REDIS_ADDRESS: ${REDIS_ADDRESS:?REDIS_ADDRESS is required}
  REDIS_USERNAME: ${REDIS_USERNAME:-default}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
  S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
  S3_USE_SSL: ${S3_USE_SSL:-false}
  SESSION_KEY: ${SESSION_KEY:?SESSION_KEY is required}
  SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-}
  VOICE_STUN_SERVER: ${VOICE_STUN_SERVER:-stun:turn.chattery.space:3478}
  VOICE_STUN_SERVERS: ${VOICE_STUN_SERVERS:-stun:turn.chattery.space:3478}
  VOICE_TURN_SERVERS: ${VOICE_TURN_SERVERS:-turn:turn.chattery.space:3478?transport=udp,turn:turn.chattery.space:3478?transport=tcp}
  VOICE_TURN_AUTH_SECRET: ${TURN_STATIC_AUTH_SECRET:?TURN_STATIC_AUTH_SECRET is required}
  VOICE_TURN_CREDENTIAL_TTL: ${VOICE_TURN_CREDENTIAL_TTL:-10m}
  VOICE_OWNER_TTL: ${VOICE_OWNER_TTL:-30s}
  VOICE_ICE_PUBLIC_IP: ${VOICE_ICE_PUBLIC_IP:-}

x-traefik-labels: &traefik-labels
  - traefik.enable=true
  - traefik.http.routers.chattery.rule=Host(`chattery.space`)
  - traefik.http.routers.chattery.entrypoints=websecure
  - traefik.http.routers.chattery.tls.certresolver=letsencrypt
  - traefik.http.routers.chattery.service=chattery
  - traefik.http.services.chattery.loadbalancer.server.port=8080

x-backend: &backend
  build:
    context: ..
    dockerfile: deployments/Dockerfile.backend
  restart: unless-stopped
  expose:
    - "8080"
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
    interval: 10s
    timeout: 5s
    retries: 5
  networks:
    - backend_private
    - dokploy_network
    - s3_private
  labels: *traefik-labels

services:
  coturn:
    image: coturn/coturn:4.11.0-r0-alpine
    restart: unless-stopped
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_STATIC_AUTH_SECRET:?TURN_STATIC_AUTH_SECRET is required}
      - --realm=${TURN_REALM:-turn.chattery.space}
      - --server-name=${TURN_REALM:-turn.chattery.space}
      - --external-ip=${TURN_EXTERNAL_IP:?TURN_EXTERNAL_IP is required}
      - --min-port=49160
      - --max-port=49259
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49259:49160-49259/udp"
    networks:
      - backend_private

  backend-1:
    <<: *backend
    ports:
      - "40000-40049:40000-40049/udp"
    environment:
      <<: *backend-env
      VOICE_NODE_ID: backend-1
      VOICE_ICE_UDP_PORT_MIN: "40000"
      VOICE_ICE_UDP_PORT_MAX: "40049"

  backend-2:
    <<: *backend
    ports:
      - "40050-40099:40050-40099/udp"
    environment:
      <<: *backend-env
      VOICE_NODE_ID: backend-2
      VOICE_ICE_UDP_PORT_MIN: "40050"
      VOICE_ICE_UDP_PORT_MAX: "40099"

networks:
  dokploy_network:
    name: dokploy-network
    external: true
  backend_private:
    name: chattery-backend-private
    external: true
  s3_private:
    name: chattery-s3-private
    external: true
