<!doctype html>
<html class="h-full">
  <head>
    <link href="./styles.css" rel="stylesheet" />
  </head>
  <body class="h-full flex items-center justify-center bg-rose-50">
    <form class="border-3 w-md neo-shadow-lg rounded-xl m-auto p-4 bg-white">
      <div>
        <h1 class="text-2xl font-semibold tracking-wider">Welcome Back</h1>
        <p>Enter your credentials to access your account.</p>
      </div>
      <div class="mt-4">
        <label class="block font-semibold" for="email">Email</label>
        <input
          class="px-2 border-2 neo-shadow rounded-lg focus:outline-none focus:border-sky-500 w-full"
          id="email"
          name="login"
          type="email"
          required
        />
      </div>
      <div class="input-group mt-4">
        <label class="block font-semibold" for="password">Password</label>
        <input
          class="px-2 border-2 neo-shadow rounded-lg focus:outline-none focus:border-sky-500 w-full"
          id="password"
          name="password"
          required
        />
        <button
          class="block ml-auto mt-1 px-2 border-2 neo-shadow rounded-lg bg-amber-200 hover:bg-amber-500 focus:outline-none focus:border-amber-500 hover:scale-105 transition-all duration-300 ease-in-out"
          type="button"
        >
          Hide
        </button>
      </div>
      <button
        class="mb-4 px-4 py-1 text-lg text-center border-2 neo-shadow rounded-lg bg-sky-200 hover:bg-sky-500 focus:outline-none focus:border-sky-500 hover:scale-105 transition-all duration-300 ease-in-out tracking-wider"
        type="submit"
      >
        Login
      </button>
      <div>
        Don't have an account?
        <a href="/signup" class="text-amber-500 hover:text-sky-500">Sign Up</a>
      </div>
    </form>
  </body>
</html>
